<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>dialog.js — real-browser harness</title>
        <link rel="stylesheet" href="../src/dialog.css" />
        <style>
            /* Simulate an app's own theme: the overlay INHERITS this (font/color/scheme) and
     reads our brand via mapped --dlg-* tokens — no overlay edits needed. */
            :root {
                color-scheme: dark;
                --brand: #7c5cff;
                --dlg-primary-bg: var(--brand);
                --dlg-radius: 14px;
            }
            body {
                background: #14141b;
                color: #e8e8f0;
                font-family: system-ui, sans-serif;
                padding: 24px;
            }
        </style>
    </head>
    <body>
        <h3>dialog.js focus-trap / Esc / light-dismiss harness</h3>
        <button id="outside">Outside button</button>

        <h3>Drawer — edge · scrollable body · pinned footer</h3>
        <button data-drawer="right">Right</button>
        <button data-drawer="left">Left</button>
        <button data-drawer="top">Top</button>
        <button data-drawer="bottom">Bottom</button>
        <p style="color:#8a8aa0;font-size:13px">
            Each opens from its edge, shows a long scrolling list, and keeps the
            footer buttons pinned. Esc or click the backdrop to close.
        </p>

        <div id="log"></div>
        <script type="module">
            import { dialog, confirm, drawer } from "../src/dialog.js";

            for (const btn of document.querySelectorAll("[data-drawer]")) {
                btn.addEventListener("click", () => {
                    const pos = btn.dataset.drawer;
                    const d = drawer({
                        position: pos,
                        title: "Filters — " + pos,
                        content: (body) => {
                            for (let i = 1; i <= 30; i++) {
                                const p = document.createElement("p");
                                p.textContent = "Option " + i + " — a long enough list to force the body to scroll.";
                                body.append(p);
                            }
                        },
                        footer: (foot) => {
                            const row = document.createElement("div");
                            row.className = "puredashboard-dialog__actions";
                            const cancel = document.createElement("button");
                            cancel.className = "puredashboard-dialog__button";
                            cancel.textContent = "Cancel";
                            cancel.addEventListener("click", () => d.close("cancel"));
                            const apply = document.createElement("button");
                            apply.className = "puredashboard-dialog__button puredashboard-dialog__button--primary";
                            apply.textContent = "Apply";
                            apply.addEventListener("click", () => d.close("apply"));
                            row.append(cancel, apply);
                            foot.append(row);
                        },
                    });
                    d.closed.then((v) => {
                        document.getElementById("log").textContent = "drawer(" + pos + ") closed: " + (v ?? "");
                    });
                    d.show();
                });
            }
            window.__confirm = () => {
                window.__result = "pending";
                confirm("Delete it?", { title: "Confirm", danger: true }).then(
                    (v) => (window.__result = v),
                );
                return true;
            };
            window.__open = () => {
                const d = dialog({
                    title: "Test dialog",
                    content: (body) => {
                        const i = document.createElement("input");
                        i.id = "inside-input";
                        i.value = "hi";
                        body.append(i);
                        const b = document.createElement("button");
                        b.id = "inside-btn";
                        b.textContent = "Inside";
                        body.append(b);
                    },
                });
                d.closed.then((v) => {
                    document.getElementById("log").textContent =
                        "closed:" + (v ?? "");
                });
                window.__d = d.show();
                return true;
            };
        </script>
    </body>
</html>
